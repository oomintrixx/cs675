# docker-compose.yml
services:
  pyspark:
    image: jupyter/pyspark-notebook:spark-3.5.0
    volumes:
      - ./work:/home/jovyan/work
      - ./tests:/home/jovyan/tests
      - ./data:/home/jovyan/data
      - ./spark-events:/tmp/spark-events
    ports:
      - "4040:4040"
      - "18080:18080"
    environment:
      - SPARK_MASTER=local[*]
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/home/jovyan:/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip
    command: bash -c "pip install -q pytest==8.2.0 && start.sh jupyter lab --no-browser"
  history:
    image: jupyter/pyspark-notebook:spark-3.5.0
    volumes:
      - ./spark-events:/tmp/spark-events
    ports:
      - "18081:18080"
    command: bash -c "/usr/local/spark/sbin/start-history-server.sh && tail -f /dev/null"
    environment:
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=/tmp/spark-events
